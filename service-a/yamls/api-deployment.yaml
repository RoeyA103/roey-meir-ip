apiVersion: apps/v1
kind: Deployment
metadata:
  name: coordinator-api

spec:
  replicas: 2
  selector:
    matchLabels:
      app: coordinator-api
  template:
    metadata:
      labels:
        app: coordinator-api
        tier: application
    spec:
      containers:
      - name: coordinator-api
        image: mma44331/meyir-royi:v7
        ports:
        - containerPort: 8000
          name: http



