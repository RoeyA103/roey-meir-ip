apiVersion: apps/v1
kind: Deployment
metadata:
  name: coordinator-api

spec:
  replicas: 2
  selector:
    matchLabels:
      app: coordinator-api
  template:
    metadata:
      labels:
        app: coordinator-api
        tier: application
    spec:
      containers:
      - name: coordinator-api
        image: mma44331/meyir-royi:v9
        ports:
        - containerPort: 8000
          name: http
        env:
          - name: STREAMLIT_URL
            value: "http://streamlit-api-svc:8501"
          - name: REDIS_API_URL
            value: "http://redis-api-svc:8080/locations"
          - name: IP_API
            value: "http://ip-api.com/json/"
